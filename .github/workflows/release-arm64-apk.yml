name: Release ARM64 APK

on:
  push:
    tags:
      - "0.*"
  workflow_dispatch:
    inputs:
      variant:
        description: APK ISA/API variant (legacy, a11, a13, a15)
        default: "a13"

concurrency:
  group: release-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 APK on Windows
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # Compute every cache key in one cheap step.
      #
      # The warm a13 build dir is keyed on the LLVM SUBMODULE's pinned SHA, not on
      # hashFiles over the whole LLVM tree: that tree is tens of thousands of files
      # and hashFiles gets cancelled by GitHub after 120 s, which silently invalidated
      # the template (the exact failure of the last runs). The pin only changes when
      # the toolchain is bumped, so it is both stable and O(1) to compute. The recipe
      # fingerprint (configure/build scripts, a handful of small files) is what busts
      # the key when cmake arguments change.
      - name: Compute cache keys
        id: cache-keys
        shell: bash
        run: |
          LLVM_PIN="$(git -C 3rdparty/llvm/llvm rev-parse --short=12 HEAD)"
          echo "llvm=${LLVM_PIN}" >> "$GITHUB_OUTPUT"

          RECIPE="$(git hash-object \
              android/configure.sh \
              android/build-variants.sh \
              android/stamp-git-version.sh | sha1sum | cut -c1-12)"
          echo "a13-bin-key=xeno-build-a13-${{ github.ref_name }}-llvm-${LLVM_PIN}-cfg-${RECIPE}" >> "$GITHUB_OUTPUT"

          GRADLE_FILES="android/armsx3-ui/settings.gradle.kts
                        android/armsx3-ui/gradle.properties
                        android/armsx3-ui/gradle/wrapper/gradle-wrapper.properties
                        android/armsx3-ui/app/build.gradle.kts"
          [ -f android/armsx3-ui/gradle/libs.versions.toml ] && \
            GRADLE_FILES="$GRADLE_FILES android/armsx3-ui/gradle/libs.versions.toml"
          GRADLE_CFG="$(git hash-object $GRADLE_FILES | sha1sum | cut -c1-12)"
          echo "gradle-key=gradle-${{ runner.os }}-${GRADLE_CFG}" >> "$GITHUB_OUTPUT"

          # ANDROID_HOME is machine-level on the hosted image, but make it explicit so the
          # cache paths below resolve on any runner. GRADLE_USER_HOME is parked inside the
          # workspace so the whole gradle cache is one self-contained directory to cache.
          echo "ANDROID_HOME=${ANDROID_HOME:-C:\\Android\\android-sdk}" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=${{ github.workspace }}/.gradle" >> "$GITHUB_ENV"

      # Reuse the previously downloaded Android SDK pieces across runs. The NDK
      # and cmake are pinned, so this cache rarely changes and saves minutes per
      # run. Paths are ABSOLUTE (${{ env.ANDROID_HOME }}/...), not $ANDROID_HOME/...:
      # cache paths are literal and a `$VAR` entry silently points at a folder that
      # never exists, which is why no SDK cache was ever saved before.
      - name: Restore Android SDK cache
        uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_HOME }}/cmdline-tools/latest
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
            ${{ env.ANDROID_HOME }}/cmake/3.30.5
            ${{ env.ANDROID_HOME }}/platforms/android-37
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
          key: android-sdk-${{ runner.os }}-v1

      # librashader and libadrenotools are not submodules upstream; they are
      # fetched by hand per the repository README.
      - name: Fetch librashader
        run: git clone --depth 1 https://github.com/SnowflakePowered/librashader 3rdparty/librashader

      - name: Fetch libadrenotools
        run: git clone --depth 1 --recursive https://github.com/bylaws/libadrenotools android/armsx3-ui/app/src/main/cpp/libadrenotools

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # The sdkmanager download/install is the other big per-run cost; the
        # cached components above are pinned, so a cache hit can skip it wholly.
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # GitHub-hosted Windows images keep the SDK but not always the
          # cmdline-tools; install a recent build that sees the XML v4 repo
          # (android-37 is not listed by older managers).
          CT_ZIP="https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools/_ct"
          curl -sSL -o /tmp/cmdline-tools.zip "$CT_ZIP"
          unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/_ct"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R "$ANDROID_HOME/cmdline-tools/_ct/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools/_ct" /tmp/cmdline-tools.zip
          SDKM="$(cygpath -m "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat")"
          echo "sdkmanager: $SDKM"
          ROOT="$(cygpath -m "$ANDROID_HOME")"
          # Pre-accept Android SDK licenses so sdkmanager never reads stdin
          # (yes|… SIGPIPEs the step under Git Bash pipefail).
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e30573bab4c9c91346d8abd \
            d975f751698a77b662f1254ddbedb9ad94456381 > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          cmd //c "$SDKM" --sdk_root="$ROOT" "ndk;29.0.14206865" "cmake;3.30.5" < /dev/null
          # No "platforms;android-37" package exists in the repo (only the
          # minor-line 37.2). Install 37.2 and alias it as android-37, which is
          # what AGP looks up for compileSdk 37.
          cmd //c "$SDKM" --sdk_root="$ROOT" "platforms;android-37.2" < /dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              cp -R "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
            else
              echo "::error::android-37 platform missing after install"
              ls "$ANDROID_HOME/platforms/"
              exit 1
            fi
          fi

      # Warm build dir for the a13 variant.
      #
      # The single biggest cost of a cold run is the in-tree LLVM 22 build (most
      # of the ~1.3 GB workspace). ninja is incremental and build-variants.sh is
      # written for warm dirs (it skips cmake when build.ninja already matches
      # the API/-march), so restoring the previous run's build-a13 only rebuilds
      # what this tag actually changed. The key pins LLVM's submodule SHA (not a
      # hashFiles -- see "Compute cache keys") so a toolchain bump invalidates it;
      # the restore-key prefix still lets older dirs be reused before the first
      # save for a given ref has been produced.
      - name: Restore a13 build dir
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: ${{ github.workspace }}/build-a13
          key: ${{ steps.cache-keys.outputs.a13-bin-key }}
          restore-keys: |
            xeno-build-a13-

      # Gradle dependency cache. Every cold run used to re-download AGP + Kotlin +
      # the foojay plugin from the network, which is exactly the step that flaked
      # and killed the last release build. Restoring it makes runs hermetic; the
      # save step below writes it back under a run-unique key so partial builds
      # still leave a usable cache.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: ${{ github.workspace }}/.gradle
          key: ${{ steps.cache-keys.outputs.gradle-key }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build ARM64 APK
        shell: bash
        env:
          ANDROID_HOME: "${{ env.ANDROID_HOME }}"
          JAVA_HOME: "${{ env.JAVA_HOME }}"
          VARIANTS: "${{ github.event.inputs.variant || 'a13' }}"
        run: |
          # Retry the whole build (ninja is incremental, so re-entry is cheap);
          # the one point of exposure is Gradle pulling resolve-time dependencies
          # on a cold cache. A couple of retries have so far always worked.
          status=1
          for i in 1 2 3; do
            if OUT_DIR="/tmp/xeno-apk" android/build-variants.sh; then
              status=0
              break
            fi
            echo "::warning::build attempt $i failed, retrying in 20s"
            sleep 20
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::build failed after 3 attempts"
            exit 1
          fi
          echo "APK_NAME=$(ls /tmp/xeno-apk/*.apk | sed 's#.*/##' | head -1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeno-arm64-apk
          path: /tmp/xeno-apk/*.apk
          if-no-files-found: error

      - name: Save Android SDK cache
        # Best-effort, and runs even when the build step failed (which is exactly
        # when its parts are worth keeping): caching must never abort a successful
        # run just before the release step.
        if: ${{ !cancelled() && steps.sdk-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/cmdline-tools/latest
            ${{ env.ANDROID_HOME }}/licenses
            ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
            ${{ env.ANDROID_HOME }}/cmake/3.30.5
            ${{ env.ANDROID_HOME }}/platforms/android-37
            ${{ env.ANDROID_HOME }}/platforms/android-37.2
          key: android-sdk-${{ runner.os }}-v1

      - name: Save a13 build dir
        # Every run is saved under a distinct key (run_id) rather than gated on
        # cache-hit: an interrupted ninja dir is resumable, so a run that fails
        # mid-LLVM still caches ~an hour of work and the next retry restores it
        # as a warm dir, rebuilding only what the fix actually touched. Restore
        # (exact key, then the "xeno-build-a13-" prefix) picks the newest.
        # Path is absolute: relative "build-a13" never validated on Windows and
        # the old save step silently produced no cache ("Path does not exist").
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build-a13
          key: ${{ steps.cache-keys.outputs.a13-bin-key }}-${{ github.run_id }}

      - name: Save Gradle cache
        # Same run-unique key scheme as the build dir, so a failed Gradle step
        # still leaves whatever it resolved before dying.
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.gradle
          key: ${{ steps.cache-keys.outputs.gradle-key }}-${{ github.run_id }}

      - name: Create GitHub Release
        # Manual dispatches on master are for producing an artifact, not a "master"
        # release; publication only makes sense for a tag.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "XENO ${{ github.ref_name }}"
          body: |
            ### ARMS3 APK (arm64-v8a)

            | Поле | Значение |
            |---|---|
            | Вариант | `a13` — armv8.2-a + dotprod + fp16, API 33 |
            | Нативное ядро | сжато в APK, `--gc-sections` + секционная компоновка |
            | Сборка | [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | APK | `${{ env.APK_NAME }}` |

            Установка требует PS3-прошивку (не включена).
          files: /tmp/xeno-apk/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}