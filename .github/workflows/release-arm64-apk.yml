name: Release ARM64 APK

on:
  push:
    tags:
      - "0.*"
  workflow_dispatch:
    inputs:
      variant:
        description: APK ISA/API variant (legacy, a11, a13, a15)
        default: "a13"

concurrency:
  group: release-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 APK on Windows
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      # Reuse the previously downloaded Android SDK pieces across runs. The NDK
      # and cmake are pinned, so this cache rarely changes and saves minutes per
      # run. Saving is guarded by the cache-hit check because actions/cache/save
      # refuses to overwrite a cache whose key already exists.
      - name: Restore Android SDK cache
        uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: |
            $ANDROID_HOME/cmdline-tools/latest
            $ANDROID_HOME/licenses
            $ANDROID_HOME/ndk/29.0.14206865
            $ANDROID_HOME/cmake/3.30.5
            $ANDROID_HOME/platforms/android-37
            $ANDROID_HOME/platforms/android-37.2
          key: android-sdk-${{ runner.os }}-v1

      # librashader and libadrenotools are not submodules upstream; they are
      # fetched by hand per the repository README.
      - name: Fetch librashader
        run: git clone --depth 1 https://github.com/SnowflakePowered/librashader 3rdparty/librashader

      - name: Fetch libadrenotools
        run: git clone --depth 1 https://github.com/bylaws/libadrenotools android/armsx3-ui/app/src/main/cpp/libadrenotools

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # The sdkmanager download/install is the other big per-run cost; the
        # cached components above are pinned, so a cache hit can skip it wholly.
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # GitHub-hosted Windows images keep the SDK but not always the
          # cmdline-tools; install a recent build that sees the XML v4 repo
          # (android-37 is not listed by older managers).
          CT_ZIP="https://dl.google.com/android/repository/commandlinetools-win-13114758_latest.zip"
          mkdir -p "$ANDROID_HOME/cmdline-tools/_ct"
          curl -sSL -o /tmp/cmdline-tools.zip "$CT_ZIP"
          unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools/_ct"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R "$ANDROID_HOME/cmdline-tools/_ct/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf "$ANDROID_HOME/cmdline-tools/_ct" /tmp/cmdline-tools.zip
          SDKM="$(cygpath -m "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat")"
          echo "sdkmanager: $SDKM"
          ROOT="$(cygpath -m "$ANDROID_HOME")"
          # Pre-accept Android SDK licenses so sdkmanager never reads stdin
          # (yes|… SIGPIPEs the step under Git Bash pipefail).
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            84831b9409646a918e30573bab4c9c91346d8abd \
            d975f751698a77b662f1254ddbedb9ad94456381 > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' 8933bad161af4178b1185d1a37fbf41ea5269c55 \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          cmd //c "$SDKM" --sdk_root="$ROOT" "ndk;29.0.14206865" "cmake;3.30.5" < /dev/null
          # No "platforms;android-37" package exists in the repo (only the
          # minor-line 37.2). Install 37.2 and alias it as android-37, which is
          # what AGP looks up for compileSdk 37.
          cmd //c "$SDKM" --sdk_root="$ROOT" "platforms;android-37.2" < /dev/null || true
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              cp -R "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
            else
              echo "::error::android-37 platform missing after install"
              ls "$ANDROID_HOME/platforms/"
              exit 1
            fi
          fi

      # Warm build dir for the a13 variant.
      #
      # The single biggest cost of a cold run is the in-tree LLVM 22 build (most
      # of the ~1.3 GB workspace). ninja is incremental and build-variants.sh is
      # written for warm dirs (it skips cmake when build.ninja already matches
      # the API/-march), so restoring the previous run's build-a13 only rebuilds
      # what this tag actually changed. The key pins LLVM's source so a toolchain
      # bump invalidates it; the bare restore-key still lets older dirs be reused
      # by tag N before tag N+1 has saved its own.
      - name: Restore a13 build dir
        uses: actions/cache/restore@v4
        id: build-cache
        with:
          path: build-a13
          key: xeno-build-a13-${{ github.ref_name }}-${{ hashFiles('3rdparty/llvm/**') }}
          restore-keys: |
            xeno-build-a13-

      - name: Build ARM64 APK
        shell: bash
        env:
          ANDROID_HOME: "${{ env.ANDROID_HOME }}"
          JAVA_HOME: "${{ env.JAVA_HOME }}"
          VARIANTS: "${{ github.event.inputs.variant || 'a13' }}"
        run: |
          OUT_DIR="/tmp/xeno-apk" android/build-variants.sh
          echo "APK_NAME=$(ls /tmp/xeno-apk/*.apk | sed 's#.*/##' | head -1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xeno-arm64-apk
          path: /tmp/xeno-apk/*.apk
          if-no-files-found: error

      - name: Save Android SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            $ANDROID_HOME/cmdline-tools/latest
            $ANDROID_HOME/licenses
            $ANDROID_HOME/ndk/29.0.14206865
            $ANDROID_HOME/cmake/3.30.5
            $ANDROID_HOME/platforms/android-37
            $ANDROID_HOME/platforms/android-37.2
          key: android-sdk-${{ runner.os }}-v1

      - name: Save a13 build dir
        # Skip when the restored dir was already the exact key and nothing
        # rebuilt -- saving would just re-create it.
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-a13
          key: xeno-build-a13-${{ github.ref_name }}-${{ hashFiles('3rdparty/llvm/**') }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "XENO ${{ github.ref_name }}"
          body: |
            ### ARMS3 APK (arm64-v8a)

            | Поле | Значение |
            |---|---|
            | Вариант | `a13` — armv8.2-a + dotprod + fp16, API 33 |
            | Нативное ядро | сжато в APK, `--gc-sections` + секционная компоновка |
            | Сборка | [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            | APK | `${{ env.APK_NAME }}` |

            Установка требует PS3-прошивку (не включена).
          files: /tmp/xeno-apk/*.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}